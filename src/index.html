<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101317"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>Optiline · PH Racing Lab</title></head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">OP</span><div><strong>OPTILINE</strong><small>PH RACING LAB</small></div></div>
      <div class="run-status">
        <div id="work-overlay" class="work-overlay" role="status" aria-live="polite" hidden>
          <span>OPTIMIZING</span>
          <div class="validation-progress" role="progressbar" aria-label="Validation in progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        </div>
        <span id="engine-dot" class="status-dot"></span><span id="engine-status">Preparing PH catalog</span>
      </div>
      <div class="top-actions"><button id="play-button" class="button ghost">▶ PLAY</button><button id="zoom-button" class="button toggle" aria-pressed="false">ZOOMED</button><button id="save-button" class="button ghost" disabled>SAVE</button></div>
    </header>
    <aside class="sidebar">
      <div class="panel-title"><span>TRACK CATALOG</span><span class="catalog-actions"><button id="new-track-button" type="button">+ OVAL</button><span id="track-count" class="count"></span></span></div>
      <div id="track-list" class="track-list" role="listbox" aria-label="Racing tracks"></div>
      <div class="saved-header"><span>SAVED PROFILES</span><span id="saved-count" class="count">0</span></div>
      <div id="saved-list" class="saved-list"><p class="empty">No saved profiles on this track.</p></div>
    </aside>
    <main class="workspace">
      <section class="viewer-panel">
        <canvas id="track-canvas" aria-label="Track layout and racing lines"></canvas>
        <div id="track-editor" class="track-editor" hidden><label for="track-editor-name">CUSTOM TRACK</label><input id="track-editor-name" maxlength="80"><span>DRAG ORANGE NODES</span><button id="track-editor-done" type="button">DONE</button></div>
        <div class="viewer-overlay top-left"><span id="track-name">—</span><small id="track-meta">—</small></div>
        <div class="viewer-overlay top-right"><label for="focus-select">FOCUS</label><select id="focus-select"><option value="current">Current line</option></select></div>
        <div class="viewer-overlay bottom-left viewer-footer">
          <div class="metrics"><div><b id="lap-time">—</b><small>LAP TIME</small></div><div><b id="line-length">—</b><small>LINE LENGTH</small></div><div><b id="station-rate">—</b><small>STATIONS/S</small></div><div><b id="candidate-count">—</b><small>CANDIDATES</small></div><div><b id="optimization-time">—</b><small>OPT TIME</small></div></div>
        </div>
      </section>
      <section class="control-panel">
        <div class="optimization-control"><button id="optimize-button" class="button optimize">OPTIMIZE</button></div>
        <div class="configuration-head"><h1>Configuration</h1><button id="reset-button" class="button reset">RESET</button></div>
        <div class="configuration-scroll">
          <div id="settings-grid" class="settings-grid"></div>
        </div>
      </section>
    </main>
    <section class="chart-panel"><div class="chart-head"><div id="profile-labels" class="chart-labels" aria-label="Profile series"></div><div class="chart-controls"><div class="playback-speed"><label for="profile-axis-select">X AXIS</label><select id="profile-axis-select"><option value="time">Lap time</option><option value="distance">Track centerline distance</option></select></div><div class="playback-speed"><label for="speed-select">PLAYBACK</label><select id="speed-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div></div></div><canvas id="profile-canvas" aria-label="Speed acceleration stability and curvature profile"></canvas></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
